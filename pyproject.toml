[project]
name = "pulse"
version = "0.1.0"
description = "Watchdog для сервисов на Railway и Vercel: подтверждённые алерты с разбором логов в Telegram"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "anthropic>=1.3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
pulse = "pulse.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
