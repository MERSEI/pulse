name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Тесты
        run: pytest -q

      - name: Конфигурация читается без единого токена
        # Разовый прогон обязан работать до того, как заведён бот, иначе
        # первую проверку «вижу ли я свои сервисы» сделать нечем.
        run: |
          cp targets.yml.example targets.yml
          python -c "
          from pulse.config import load
          s = load('targets.yml')
          assert s.telegram_enabled is False
          assert len(s.endpoints) == 3, s.endpoints
          print('конфигурация читается:', len(s.endpoints), 'http-таргетов')
          "
